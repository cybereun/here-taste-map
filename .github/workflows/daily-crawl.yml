name: Daily Blog TasteMap Crawl

on:
  schedule:
    # 매시간 17분 (GitHub 실행 대기 상황에 따라 지연될 수 있음)
    - cron: '17 * * * *'
  workflow_dispatch: # 수동 실행 버튼 지원

# GitHub Actions에 리포지토리 푸시(Write) 권한 부여 (exit code 128 해결)
permissions:
  contents: write

concurrency:
  group: blog-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install beautifulsoup4 pillow

      - name: Run Crawler
        run: |
          python -m unittest scripts.test_crawler_regression
          python scripts/crawler.py

      - name: Sync data to public
        run: |
          mkdir -p public/data
          cp data/places.json public/data/places.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/places.json data/cache_posts.json public/data/places.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: 블로그 맛집 데이터 자동 갱신"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
